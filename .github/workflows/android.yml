name: Android build and core regression

concurrency:
  group: mebel3d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-regression:
    name: Kotlin core regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Kotlin compiler
        uses: fwilhe2/setup-kotlin@v1
        with:
          version: '2.0.21'
      - name: Compile and run all core smoke tests
        run: ./scripts/check-core.sh

  android-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
      - name: Install Android 35 platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9 with dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify release integration contract
        run: ./scripts/check-release-readiness.sh
      - name: Compile Android sources and run unit tests
        run: gradle --no-daemon --stacktrace :android:app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :android:app:assembleDebug
      - name: Prepare APK verification files
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p build-delivery
          cp "$APK" build-delivery/Mebel3D-debug.apk
          sha256sum build-delivery/Mebel3D-debug.apk > build-delivery/SHA256SUMS.txt
          {
            echo "Application: Мебель 3D"
            echo "Version: $(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d '"' -f2)"
            echo "Commit: $GITHUB_SHA"
            echo "Build: debug APK, signed with Android debug key"
            echo "Checks: Android unit tests and release preflight completed before assembly"
          } > build-delivery/BUILD-INFO.txt
      - name: Upload installable APK and verification info
        uses: actions/upload-artifact@v4
        with:
          name: Mebel3D-debug-APK-${{ github.sha }}
          path: build-delivery/*
          if-no-files-found: error
          retention-days: 30
