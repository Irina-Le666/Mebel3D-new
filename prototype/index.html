<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мебель 3D — интерактивный прототип</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--line:#dce2ed;--text:#172033;--muted:#69758a;--blue:#1677f8;--blue2:#e6f0ff;--shadow:0 5px 20px #26385c12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:66px 1fr 76px;gap:8px;padding:8px}.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#ffffffed;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}.brand{min-width:210px;font-weight:750;font-size:16px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}.top .spacer{flex:1}.btn,button,select,input{font:inherit}.btn,button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;cursor:pointer;color:var(--text);white-space:nowrap}.btn:hover,button:hover{border-color:#9bbff6}.btn.active,button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.layout{min-height:0;display:grid;grid-template-columns:176px minmax(190px,245px) minmax(320px,1fr) 226px;gap:8px}.nav,.catalog,.props,.workspace,.bottom{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:0}.nav{padding:9px;display:flex;flex-direction:column;gap:4px}.nav button{text-align:left;border:0;padding:12px 10px}.nav button.active{background:var(--blue2);color:#075fce;font-weight:700}.catalog{padding:10px;overflow:auto}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fafcff;margin-bottom:10px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.chips button{padding:6px 9px;border-radius:20px;font-size:12px}.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:8px 5px;text-align:center;cursor:pointer;background:linear-gradient(#fff,#f7f9fd)}.item:hover{outline:2px solid #9cc5ff}.thumb{height:68px;display:grid;place-items:center;font-size:43px}.item span{font-size:12px}.workspace{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#fff 0,#f7f9fd 60%,#edf1f8 100%)}.scene-head{position:absolute;z-index:2;left:14px;top:12px;display:flex;gap:7px}.scene-head span{background:#ffffffd9;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12px}.scene{position:absolute;inset:55px 10px 12px;display:grid;place-items:center;perspective:1000px}.room{width:min(70%,660px);height:min(68%,420px);position:relative;transform:rotateX(57deg) rotateZ(-35deg);transform-style:preserve-3d;transition:transform .3s}.floor{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#e6cba8 0 2px,#efdcc2 2px 40px),repeating-linear-gradient(90deg,transparent 0 58px,#d6b892 59px 61px);border:5px solid #9da9b8;box-shadow:0 20px 35px #1d2d441a;transform:translateZ(0)}.wall{position:absolute;background:linear-gradient(90deg,#eee8e2,#fff);border:3px solid #aab3bf;transform-style:preserve-3d}.wall.back{left:0;top:-13px;width:100%;height:20px;transform-origin:bottom;transform:rotateX(-90deg);background:#eee8e2}.wall.left{left:-13px;top:0;width:20px;height:100%;transform-origin:right;transform:rotateY(90deg);background:#e5e8ed}.furn{position:absolute;display:grid;place-items:center;border:2px solid #b99c78;background:linear-gradient(135deg,#e2c49d,#cda77c);box-shadow:3px 5px 0 #9b7e5e66;color:#654a2d;font-size:12px;transform:translateZ(12px);cursor:pointer;transition:outline .15s}.furn.selected{outline:4px solid #1677f8;outline-offset:2px}.furn.sofa{left:53%;top:52%;width:26%;height:17%;background:linear-gradient(135deg,#f2e9df,#d9cbbd);border-color:#c7b9a9}.furn.table{left:32%;top:43%;width:21%;height:17%;background:#d7ad7d}.furn.cabinet{left:9%;top:12%;width:16%;height:48%;background:repeating-linear-gradient(90deg,#d9b88e 0 48%,#b58c5e 49% 51%,#d9b88e 52%)}.furn.plant{left:82%;top:12%;width:9%;height:12%;border:0;background:#79a46e;border-radius:50%}.measure{position:absolute;z-index:1;color:#59677b;font-size:12px;font-weight:650}.measure.top{top:18%;left:40%}.measure.side{left:12%;top:50%;transform:rotate(-90deg)}.compass{position:absolute;right:14px;top:62px;border-radius:50%;width:66px;height:66px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:#2278ed;font-weight:800}.zoom{position:absolute;right:14px;top:145px;display:grid;gap:6px}.zoom button{width:40px;height:40px;font-size:18px;padding:0}.minimap{position:absolute;right:16px;bottom:16px;width:108px;height:86px;background:#fff;border:3px solid #aeb9c8;border-radius:7px;display:grid;place-items:center;color:#68768b;font-size:11px}.props{padding:12px;overflow:auto}.props-head{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:750;margin-bottom:8px}.preview{height:76px;border-radius:12px;background:#f4f6fa;display:grid;place-items:center;font-size:45px;margin-bottom:12px}.section{font-weight:700;margin:12px 0 7px}.field{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:center;margin:6px 0;color:#455168}.field input{width:100%;min-width:0;border:1px solid #d4dce8;border-radius:8px;padding:7px 8px;color:var(--text);background:#fff}.actions{display:grid;gap:6px;margin-top:12px}.actions button{text-align:left;padding:8px 10px}.bottom{display:flex;align-items:center;gap:10px;padding:8px 12px;overflow:hidden}.status{font-size:12px;color:var(--muted);white-space:nowrap}.strip{display:flex;gap:8px;overflow:auto;margin-left:auto}.mini{min-width:68px;height:54px;border:1px solid var(--line);border-radius:10px;background:#fafbfe;display:grid;place-items:center;font-size:30px;cursor:pointer}.mini.selected{border:2px solid var(--blue);background:var(--blue2)}.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.mode2d .room{transform:none;width:min(72%,600px);height:min(72%,360px);}.mode2d .wall{display:none}.mode2d .floor{border:2px solid #6d7b90;background-color:#fff;background-image:linear-gradient(#e8edf5 1px,transparent 1px),linear-gradient(90deg,#e8edf5 1px,transparent 1px);background-size:20px 20px}.mode2d .furn{transform:none;box-shadow:none}.mode2d .furn:after{content:"";position:absolute;inset:0;border:1px dashed #987b58;pointer-events:none}
@media(max-width:1100px){.layout{grid-template-columns:145px minmax(165px,205px) minmax(250px,1fr) 200px}.brand{min-width:150px}.top .optional{display:none}.props{padding:9px}.field{grid-template-columns:1fr 76px}}@media(max-width:820px){.app{padding:4px;gap:4px;grid-template-rows:56px 1fr 60px}.layout{grid-template-columns:55px minmax(125px,170px) minmax(240px,1fr)}.nav{padding:4px}.nav button{font-size:0;text-align:center;padding:12px 2px}.nav button:first-letter{font-size:17px}.props{display:none}.brand{min-width:105px;font-size:13px}.brand small{font-size:9px}.top button{padding:7px}.bottom .status:nth-child(n+2){display:none}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">⌂ Мебель 3D<small>Проект: Кухня-гостиная</small></div><button onclick="toast('Проект сохранён в демонстрационном прототипе')">▣ Сохранить</button><button onclick="toast('Отмена: демонстрация интерфейса')">↶ Отменить</button><button class="optional" onclick="toast('Повтор: демонстрация интерфейса')">↷ Повторить</button><div class="spacer"></div><button id="mode2d" onclick="setMode('2d')">▧ 2D</button><button id="mode3d" class="active" onclick="setMode('3d')">⬡ 3D</button><button class="optional" onclick="toast('Управление освещением — следующий модуль')">☼ Освещение</button><button class="optional" onclick="rotateRoom()">⛶ Вид</button><button class="optional" onclick="toast('Настройки проекта')">⚙ Настройки</button><button onclick="toast('Экспорт появится в модуле чертежей')">↗ Экспорт</button></header>
<div class="layout">
<nav class="nav"><button class="active" onclick="navTo(this,'Помещения')">◈ Помещения</button><button onclick="navTo(this,'Планировка')">▦ Планировка</button><button onclick="navTo(this,'Стены и проёмы')">◫ Стены и проёмы</button><button onclick="navTo(this,'Двери и окна')">▯ Двери и окна</button><button onclick="navTo(this,'Мебель')">▱ Мебель</button><button onclick="navTo(this,'Конструктор')">♧ Конструктор</button><button onclick="navTo(this,'Материалы')">⬡ Материалы</button><button onclick="navTo(this,'Инженерия')">♧ Инженерия</button><button onclick="navTo(this,'Размеры и чертежи')">⌗ Размеры и чертежи</button><button onclick="navTo(this,'Фото помещения')">▣ Фото помещения</button><button onclick="navTo(this,'Сохранение')">▣ Сохранение</button></nav>
<aside class="catalog"><input class="search" id="search" placeholder="⌕ Поиск мебели…" oninput="filterItems()"><div class="chips"><button class="active" onclick="filterCategory('Все',this)">Все</button><button onclick="filterCategory('Кухня',this)">Кухня</button><button onclick="filterCategory('Гостиная',this)">Гостиная</button><button onclick="filterCategory('Спальня',this)">Спальня</button><button onclick="filterCategory('Ванная',this)">Ванная</button><button onclick="filterCategory('Офис',this)">Офис</button></div><div class="items" id="items"><div class="item" data-name="Диван" data-cat="Гостиная" onclick="addItem('Диван','🛋️','sofa')"><div class="thumb">🛋️</div><span>Диван</span></div><div class="item" data-name="Кресло" data-cat="Гостиная" onclick="addItem('Кресло','🪑','chair')"><div class="thumb">🪑</div><span>Кресло</span></div><div class="item" data-name="Стол" data-cat="Гостиная" onclick="addItem('Стол','🪵','table')"><div class="thumb">▱</div><span>Стол</span></div><div class="item" data-name="Стул" data-cat="Гостиная" onclick="addItem('Стул','🪑','chair')"><div class="thumb">🪑</div><span>Стул</span></div><div class="item" data-name="Шкаф" data-cat="Спальня" onclick="addItem('Шкаф','🚪','cabinet')"><div class="thumb">🚪</div><span>Шкаф</span></div><div class="item" data-name="Комод" data-cat="Спальня" onclick="addItem('Комод','🗄️','cabinet')"><div class="thumb">🗄️</div><span>Комод</span></div><div class="item" data-name="Кровать" data-cat="Спальня" onclick="addItem('Кровать','🛏️','bed')"><div class="thumb">🛏️</div><span>Кровать</span></div><div class="item" data-name="Тумба" data-cat="Спальня" onclick="addItem('Тумба','🗃️','cabinet')"><div class="thumb">🗃️</div><span>Тумба</span></div><div class="item" data-name="Кухонный модуль" data-cat="Кухня" onclick="addItem('Кухонный модуль','▤','cabinet')"><div class="thumb">▤</div><span>Кухонный модуль</span></div><div class="item" data-name="Раковина" data-cat="Ванная" onclick="addItem('Раковина','🚰','sink')"><div class="thumb">🚰</div><span>Раковина</span></div></div></aside>
<main class="workspace" id="workspace"><div class="scene-head"><span id="viewLabel">3D · Изометрия</span><span>Комната 5 000 × 3 500 мм</span></div><div class="measure top">5 000 мм</div><div class="measure side">3 500 мм</div><div class="scene"><div class="room" id="room"><div class="floor"></div><div class="wall back"></div><div class="wall left"></div><div class="furn cabinet" data-name="Шкаф" onclick="selectObject(this)"></div><div class="furn table" data-name="Стол" onclick="selectObject(this)"></div><div class="furn sofa selected" data-name="Диван" onclick="selectObject(this)"></div><div class="furn plant" data-name="Растение" onclick="selectObject(this)"></div></div></div><div class="compass">Z ↑<br>Y ← X →</div><div class="zoom"><button onclick="zoomRoom(1.08)">＋</button><button onclick="zoomRoom(.92)">−</button><button onclick="rotateRoom()">⟳</button><button onclick="setMode('3d')">⬡</button></div><div class="minimap">План сверху<br>▱ ▤ ▢</div><div class="toast" id="toast"></div></main>
<aside class="props"><div class="props-head"><span id="objName">Диван</span><span>×</span></div><div class="preview" id="objPreview">🛋️</div><div class="section">Размеры (мм)</div><label class="field">Ширина <input id="w" type="number" value="2400" min="1" onchange="updateDimensions()"></label><label class="field">Глубина <input id="d" type="number" value="900" min="1" onchange="updateDimensions()"></label><label class="field">Высота <input id="h" type="number" value="850" min="1" onchange="updateDimensions()"></label><div class="section">Положение (мм)</div><label class="field">X <input id="x" type="number" value="1800" onchange="updateDimensions()"></label><label class="field">Y <input id="y" type="number" value="800" onchange="updateDimensions()"></label><label class="field">Z <input id="z" type="number" value="0" onchange="updateDimensions()"></label><label class="field">Поворот <input id="angle" type="number" value="0" step="5" onchange="updateDimensions()"></label><div class="actions"><button onclick="toast('Откроется расширенный редактор размеров')">⛶ Изменить размеры</button><button onclick="toast('Материалы будут подключены к геометрической модели')">◉ Материал и цвет</button><button onclick="duplicateSelected()">▢ Дублировать</button><button onclick="deleteSelected()">🗑 Удалить</button></div></aside>
</div>
<footer class="bottom"><span class="status">мм</span><span class="status" id="statusMode">Режим: 3D</span><span class="status" id="statusSelected">Выбрано: Диван</span><div class="strip" id="strip"><div class="mini selected" onclick="selectByName('Диван')">🛋️</div><div class="mini" onclick="selectByName('Шкаф')">🚪</div><div class="mini" onclick="selectByName('Стол')">▱</div><div class="mini" onclick="selectByName('Растение')">🪴</div></div><button onclick="toast('Дополнительные команды')">Ещё⌄</button></footer>
</div>
<script>
let selected=null,category='Все',zoom=1,rot=0,count=0;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove('show'),2100)}function selectObject(el){document.querySelectorAll('.furn').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=el;const name=el.dataset.name||'Объект';document.getElementById('objName').textContent=name;document.getElementById('statusSelected').textContent='Выбрано: '+name;const icons={'Диван':'🛋️','Шкаф':'🚪','Стол':'▱','Растение':'🪴','Кресло':'🪑','Стул':'🪑','Кровать':'🛏️','Комод':'🗄️','Тумба':'🗃️'};document.getElementById('objPreview').textContent=icons[name]||'▤';const d={'Диван':[2400,900,850],'Шкаф':[1200,600,2200],'Стол':[1200,700,750],'Растение':[350,350,900] }[name]||[800,600,900];['w','d','h'].forEach((id,i)=>document.getElementById(id).value=d[i]);document.querySelectorAll('.mini').forEach(m=>m.classList.toggle('selected',m.textContent.trim()===(icons[name]||'')))}function selectByName(n){const el=[...document.querySelectorAll('.furn')].find(x=>x.dataset.name===n);if(el)selectObject(el)}function setMode(m){const ws=document.getElementById('workspace');ws.classList.toggle('mode2d',m==='2d');document.getElementById('mode2d').classList.toggle('active',m==='2d');document.getElementById('mode3d').classList.toggle('active',m==='3d');document.getElementById('viewLabel').textContent=m==='2d'?'2D · План сверху':'3D · Изометрия';document.getElementById('statusMode').textContent='Режим: '+m.toUpperCase()}function updateDimensions(){if(!selected)return;selected.style.width=Math.max(4,Math.min(38,Number(document.getElementById('w').value)/80))+'%';selected.style.height=Math.max(4,Math.min(55,Number(document.getElementById('d').value)/45))+'%';selected.style.transform='translateZ(12px) rotateZ('+Number(document.getElementById('angle').value)+'deg)';toast('Параметры изменены в демонстрационной сцене')}function addItem(name,emoji,cls){const room=document.getElementById('room');const el=document.createElement('div');el.className='furn '+cls;el.dataset.name=name;el.textContent=emoji;el.style.left=(12+(count*13)%68)+'%';el.style.top=(16+(count*17)%65)+'%';el.style.width='15%';el.style.height='15%';el.onclick=()=>selectObject(el);room.appendChild(el);count++;selectObject(el);toast(name+' добавлен в прототип')}function duplicateSelected(){if(!selected)return;const el=selected.cloneNode(true);el.classList.remove('selected');el.style.left=(parseFloat(selected.style.left||'53')+8)+'%';el.onclick=()=>selectObject(el);selected.parentElement.appendChild(el);selectObject(el);toast('Объект дублирован')}function deleteSelected(){if(!selected)return;const name=selected.dataset.name;selected.remove();selected=null;document.getElementById('objName').textContent='Объект не выбран';document.getElementById('statusSelected').textContent='Объект удалён: '+name;document.getElementById('objPreview').textContent='＋';toast('Объект удалён из демонстрационной сцены')}function zoomRoom(v){zoom=Math.max(.7,Math.min(1.5,zoom*v));document.getElementById('room').style.scale=zoom}function rotateRoom(){rot+=10;document.getElementById('room').style.rotate=rot+'deg'}function filterCategory(c,b){category=c;document.querySelectorAll('.chips button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterItems()}function filterItems(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.item').forEach(i=>i.style.display=((category==='Все'||i.dataset.cat===category)&&i.dataset.name.toLowerCase().includes(q))?'':'none')}function navTo(b,name){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast('Раздел «'+name+'»: интерфейсная точка входа прототипа')}selectByName('Диван');
</script></body></html>
